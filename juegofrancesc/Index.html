
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ARCHIVO 001 — Misión: Recuperar el Regalo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@700&display=swap" rel="stylesheet">

<style>

  :root{
    --bg: #3d1b1b;
    --panel: #1d2234;
    --accent: #ff5d8f;
    --accent2: #5dd6ff;
    --wall: #784040;
    --text: #f2f2f7;
    --pink-dark: #a83f69;
    --pink-light: #ff8fb3;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    height:100%;
  }

  body{

    margin:0;
    min-height:100%;

    background:
      radial-gradient(
        circle at 50% 0%,
        #cb4141 0%,
        #672424 35%,
        var(--bg) 75%
      );

    color:var(--text);

    font-family:'Baloo 2',sans-serif;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    padding:28px 16px 40px;

    position:relative;
    overflow-x:hidden;
  }


  /* =====================================================
     FONDO ROMÁNTICO
     ===================================================== */

  body::before{

    content:"";

    position:fixed;

    width:420px;
    height:420px;

    top:-170px;
    left:50%;

    transform:translateX(-50%);

    background:
      radial-gradient(
        circle,
        rgba(255,93,143,.20) 0%,
        rgba(255,93,143,.08) 35%,
        transparent 70%
      );

    pointer-events:none;

    z-index:0;
  }


  /* Corazones decorativos */

  .heart{
    position:fixed;

    color:var(--accent);

    font-family:'Press Start 2P',monospace;

    opacity:.18;

    pointer-events:none;

    z-index:0;

    animation:
      floatHeart var(--duration) ease-in-out infinite;
  }


  .heart.small{
    font-size:8px;
    opacity:.28;
  }

  .heart.medium{
    font-size:12px;
    opacity:.20;
  }

  .heart.big{
    font-size:18px;
    opacity:.13;
  }


  @keyframes floatHeart{

    0%,100%{
      transform:translateY(0) rotate(-5deg);
      opacity:.10;
    }

    50%{
      transform:translateY(-12px) rotate(5deg);
      opacity:.28;
    }

  }


  /* Brillitos */

  .sparkle{

    position:fixed;

    color:#ffd9e5;

    font-family:'Press Start 2P',monospace;

    font-size:9px;

    opacity:.18;

    pointer-events:none;

    z-index:0;

    animation:
      sparkleAnim var(--duration) ease-in-out infinite;
  }


  @keyframes sparkleAnim{

    0%,100%{
      opacity:.08;
      transform:scale(.7);
    }

    50%{
      opacity:.55;
      transform:scale(1.15);
    }

  }


  /* =====================================================
     CONTENIDO
     ===================================================== */

  h1{

    position:relative;
    z-index:2;

    font-family:'Press Start 2P',monospace;

    font-size:1rem;

    color:var(--accent2);

    text-align:center;

    letter-spacing:1px;

    margin:0 0 6px;

    text-shadow:
      0 0 8px rgba(93,214,255,.5),
      0 0 18px rgba(255,93,143,.15);
  }


  /* pequeño corazón debajo del título */

  h1::after{

    content:"♥";

    display:block;

    color:var(--accent);

    font-size:10px;

    margin-top:10px;

    opacity:.8;

    text-shadow:
      0 0 8px rgba(255,93,143,.7);
  }


  p.sub{

    position:relative;
    z-index:2;

    color:#b0b4d0;

    text-align:center;

    font-size:.95rem;

    margin:4px 0 28px;

    max-width:320px;

    line-height:1.45;
  }


  /* =====================================================
     TARJETAS
     ===================================================== */

  #levels{

    position:relative;
    z-index:2;

    display:flex;

    flex-direction:column;

    gap:14px;

    width:100%;

    max-width:380px;
  }


  .levelCard{

    display:flex;

    align-items:center;

    gap:14px;

    background:
      linear-gradient(
        135deg,
        rgba(255,255,255,.025),
        rgba(255,93,143,.025)
      ),
      var(--panel);

    border:2px solid var(--wall);

    border-radius:14px;

    padding:14px 16px;

    text-decoration:none;

    color:var(--text);

    transition:
      transform .15s ease,
      border-color .15s ease,
      box-shadow .15s ease;

    position:relative;

    overflow:hidden;
  }


  /* pequeño brillo interior */

  .levelCard::after{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(255,143,179,.08),
        transparent
      );

    transform:skewX(-20deg);

    transition:left .5s ease;

    pointer-events:none;
  }


  .levelCard:hover::after{

    left:140%;
  }


  .levelCard:active{

    transform:scale(.97);
  }


  .levelCard.unlocked{

    border-color:var(--accent2);

    box-shadow:
      0 0 16px rgba(93,214,255,.12),
      inset 0 0 20px rgba(255,93,143,.025);
  }


  .levelCard.unlocked:hover{

    border-color:var(--accent);

    box-shadow:
      0 0 20px rgba(255,93,143,.18),
      0 0 12px rgba(93,214,255,.08);
  }


  .levelCard.unlocked .levelIcon{

    background:
      linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );

    box-shadow:
      0 0 12px rgba(255,93,143,.15);
  }


  .levelCard.locked{

    filter:grayscale(1);

    opacity:.55;

    pointer-events:none;
  }


  .levelCard.locked .levelIcon{

    background:#2a2e42;
  }


  .levelIcon{

    width:52px;

    height:52px;

    min-width:52px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:1.6rem;

    position:relative;
  }


  /* Corazoncito pequeño en las tarjetas desbloqueadas */

  .levelCard.unlocked .levelIcon::after{

    content:"♥";

    position:absolute;

    right:-4px;

    bottom:-5px;

    font-size:10px;

    color:#ffd9e5;

    text-shadow:
      0 0 5px rgba(255,93,143,.8);
  }


  .levelInfo{

    flex:1;
  }


  .levelInfo h3{

    margin:0 0 4px;

    font-size:1.05rem;
  }


  .levelInfo p{

    margin:0;

    font-size:.8rem;

    color:#9aa0c3;
  }


  .lockBadge{

    font-size:1.4rem;
  }


  /* =====================================================
     PIE
     ===================================================== */

  #resetRow{

    position:relative;

    z-index:2;

    margin-top:30px;

    text-align:center;
  }


  #resetBtn{

    background:none;

    border:1px solid var(--wall);

    color:#6c7099;

    font-family:'Baloo 2',sans-serif;

    font-size:.75rem;

    padding:6px 14px;

    border-radius:20px;

    cursor:pointer;

    transition:
      border-color .2s ease,
      color .2s ease;
  }


  #resetBtn:hover{

    border-color:var(--pink-dark);

    color:#b66b89;
  }


  /* =====================================================
     PEQUEÑA DECORACIÓN INFERIOR
     ===================================================== */

  #loveDecoration{

    position:relative;

    z-index:2;

    margin-top:18px;

    color:#5f4960;

    font-family:'Press Start 2P',monospace;

    font-size:7px;

    letter-spacing:2px;

    opacity:.65;

    text-align:center;
  }


  #loveDecoration span{

    color:var(--accent);

    margin:0 5px;

  }


  /* =====================================================
     RESPONSIVE
     ===================================================== */

  @media(max-width:420px){

    body{
      padding-top:22px;
    }

    h1{
      font-size:.88rem;
    }

    p.sub{
      font-size:.88rem;
      margin-bottom:22px;
    }

    .levelCard{
      padding:12px 13px;
    }

    .levelIcon{
      width:48px;
      height:48px;
      min-width:48px;
    }

  }

</style>
</head>

<body>


  <!-- ================================================
       DECORACIÓN DEL FONDO
       ================================================ -->

       style="left:8%;top:12%;--duration:4s;">

  <div class="heart big"
       style="left:5%;top:43%;--duration:6s;">

  </div>

  <div class="heart small"
       style="left:93%;top:48%;--duration:4.5s;">
    ♥
  </div>

  <div class="heart medium"
       style="left:9%;top:76%;--duration:5.5s;">
    ♥
  </div>

  <div class="heart small"
       style="left:87%;top:82%;--duration:4.2s;">
    ♥
  </div>


  <div class="sparkle"
       style="left:18%;top:25%;--duration:3.5s;">
    ✦
  </div>

  <div class="sparkle"
       style="left:82%;top:31%;--duration:4s;">
    ✦
  </div>

  <div class="sparkle"
       style="left:4%;top:65%;--duration:4.5s;">
    ✧
  </div>

  <div class="sparkle"
       style="left:95%;top:70%;--duration:3.8s;">
    ✧
  </div>


  <!-- ================================================
       TÍTULO
       ================================================ -->

  <h1>ARCHIVO 001</h1>

  <p class="sub">
    Misión: Superar los diferentes niveles para conseguir el tesosro.
    Completa cada nivel para desbloquear el siguiente.
  </p>


  <!-- ================================================
       NIVELES
       ================================================ -->

  <div id="levels"></div>


  <!-- ================================================
       REINICIAR
       ================================================ -->

  <div id="resetRow">

    <button id="resetBtn">
      Reiniciar progreso
    </button>

  </div>


  <div id="loveDecoration">
    <span>♥</span>
    ARCHIVO CONFIDENCIAL
    <span>♥</span>
  </div>


<script>

// ------------------------------------------------------
// Definición de los 5 niveles
// ------------------------------------------------------

const LEVELS = [

  {
    n:1,
    file:'nivel1-laberinto (1).html',
    icon:'👾',
    title:'El Laberinto',
    desc:'Encuentra la salida y esquiva al marcianito'
  },

  {
    n:2,
    file:'nivel2-runner (1).html',
    icon:'🐵',
    title:'No dejes que te atrape',
    desc:'Corre por la selva y recoge plátanos'
  },

  {
    n:3,
    file:'nivel3-puzzle.html',
    icon:'🧩',
    title:'El Puzzle',
    desc:'Reconstruye la foto pieza a pieza'
  },

  {
    n:4,
    file:'nivel4-linterna.html',
    icon:'🏚️',
    title:'La Casa Abandonada',
    desc:'Ilumina la oscuridad antes de que se acabe la pila'
  },

  {
    n:5,
    file:'nivel5-mapa.html',
    icon:'🗺️',
    title:'El Mapa del Tesoro',
    desc:'Recorre los recuerdos hasta el tesoro final'
  }

];


// ------------------------------------------------------
// Progreso
// ------------------------------------------------------

function getProgress(){

  return parseInt(
    localStorage.getItem('regaloProgress') || '1',
    10
  );

}


// ------------------------------------------------------
// Renderizar niveles
// ------------------------------------------------------

function render(){

  const progress = getProgress();

  const container =
    document.getElementById('levels');

  container.innerHTML = '';


  LEVELS.forEach(lvl => {

    const unlocked =
      lvl.n <= progress;


    const card =
      document.createElement(
        unlocked ? 'a' : 'div'
      );


    card.className =
      'levelCard ' +
      (unlocked ? 'unlocked' : 'locked');


    if(unlocked){

      card.href = lvl.file;

    }


    card.innerHTML = `

      <div class="levelIcon">
        ${unlocked ? lvl.icon : '🔒'}
      </div>

      <div class="levelInfo">

        <h3>
          Nivel ${lvl.n} · ${lvl.title}
        </h3>

        <p>
          ${
            unlocked
              ? lvl.desc
              : 'Completa el nivel anterior para desbloquear'
          }
        </p>

      </div>

      ${
        !unlocked
          ? '<div class="lockBadge">🔒</div>'
          : ''
      }

    `;


    container.appendChild(card);

  });

}


// ------------------------------------------------------
// Reiniciar progreso
// ------------------------------------------------------

document
  .getElementById('resetBtn')
  .addEventListener('click', () => {

    if(
      confirm(
        '¿Reiniciar todo el progreso? Se volverán a bloquear los niveles.'
      )
    ){

      localStorage.removeItem('regaloProgress');

      render();

    }

  });


render();

</script>

</body>
</html>
